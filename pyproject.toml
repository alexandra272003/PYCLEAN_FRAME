[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycleanframe"
version = "1.0.2"
description = "Declarative data cleaning contracts for pandas."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{name = "Alexandra Pratap Singh", email = "alexandraofficial2003@gmail.com"}]
keywords = ["pandas", "data cleaning"]
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Developers", "Programming Language :: Python :: 3"]
dependencies = ["pandas>=1.3", "numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "twine", "build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
